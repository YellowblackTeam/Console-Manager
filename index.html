<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Console Manager</title>

<style>
:root{
    --bg:#0b0f19;
    --card:#121a2a;
    --muted:#8b93a7;
    --text:#e6e9f2;
    --accent:#4f7cff;
    --danger:#ff4d4d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, Arial;
}

body{
    background:var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:720px;
    padding:24px;
}

.header{
    font-size:22px;
    font-weight:600;
    margin-bottom:20px;
    letter-spacing:0.3px;
}

/* LISTA */
.list{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding-bottom:90px;
}

.card{
    background:var(--card);
    border:1px solid rgba(255,255,255,0.05);
    border-radius:14px;
    padding:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:.15s;
}

.card:hover{
    transform:translateY(-1px);
    border-color:rgba(79,124,255,0.3);
}

.title{
    font-size:15px;
    font-weight:500;
}

.subtitle{
    font-size:13px;
    color:var(--muted);
    margin-top:4px;
}

/* BOTÃO FIXO */
.fab{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    background:var(--accent);
    border:none;
    color:white;
    padding:14px 20px;
    border-radius:12px;
    font-size:14px;
    cursor:pointer;
    width:220px;
}

.fab:hover{
    filter:brightness(1.1);
}

/* MODAL */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    display:none;
    align-items:center;
    justify-content:center;
}

.modal{
    width:92%;
    max-width:380px;
    background:var(--card);
    border-radius:16px;
    padding:18px;
    border:1px solid rgba(255,255,255,0.06);
}

.modal h2{
    font-size:16px;
    margin-bottom:14px;
    font-weight:600;
}

input,select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
    background:#0e1524;
    color:var(--text);
    outline:none;
    margin-bottom:10px;
}

input:focus,select:focus{
    border-color:var(--accent);
}

.actions{
    display:flex;
    gap:10px;
    margin-top:10px;
}

button{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    font-size:14px;
}

.save{
    background:var(--accent);
    color:white;
}

.cancel{
    background:#1a2235;
    color:var(--text);
}

.delete{
    background:transparent;
    color:var(--danger);
    border:1px solid rgba(255,77,77,0.3);
    padding:8px 10px;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">
    <div class="header">Console Manager</div>
    <div class="list" id="list"></div>
</div>

<button class="fab" onclick="openModal()">Adicionar console</button>

<div class="overlay" id="overlay">
    <div class="modal">
        <h2>Novo console</h2>

        <input id="name" placeholder="Nome do console">

        <select id="type">
            <option>PlayStation 5</option>
            <option>PlayStation 4</option>
            <option>Xbox Series X</option>
            <option>Xbox Series S</option>
            <option>Nintendo Switch</option>
            <option>Nintendo Switch 2</option>
            <option>Steam Deck</option>
            <option>Outros</option>
        </select>

        <div class="actions">
            <button class="cancel" onclick="closeModal()">Cancelar</button>
            <button class="save" onclick="add()">Salvar</button>
        </div>
    </div>
</div>

<script>

let data = [];

function save(){
    localStorage.setItem("consoles", JSON.stringify(data));
}

function load(){
    const saved = localStorage.getItem("consoles");
    if(saved) data = JSON.parse(saved);
    render();
}

function render(){
    const list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach((c,i)=>{
        list.innerHTML += `
        <div class="card">
            <div>
                <div class="title">${c.name}</div>
                <div class="subtitle">${c.type}</div>
            </div>
            <button class="delete" onclick="remove(${i})">Excluir</button>
        </div>
        `;
    });
}

function add(){
    const name = document.getElementById("name").value.trim();
    const type = document.getElementById("type").value;

    if(!name) return;

    data.push({name,type});
    save();
    render();
    closeModal();

    document.getElementById("name").value = "";
}

function remove(i){
    data.splice(i,1);
    save();
    render();
}

function openModal(){
    document.getElementById("overlay").style.display="flex";
}

function closeModal(){
    document.getElementById("overlay").style.display="none";
}

load();

</script>

</body>
  </html>
