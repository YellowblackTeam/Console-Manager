<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Console Manager</title>

<style>
:root{
    --bg:#0b0f19;
    --card:#121a2a;
    --muted:#8b93a7;
    --text:#e6e9f2;
    --accent:#4f7cff;
    --danger:#ff4d4d;
    --green:#22c55e;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui;
}

body{
    background:var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:720px;
    padding:24px;
}

.header{
    font-size:20px;
    font-weight:600;
    margin-bottom:20px;
    cursor:pointer;
}

/* LISTA */
.list{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding-bottom:90px;
}

.card{
    background:var(--card);
    border:1px solid rgba(255,255,255,0.05);
    border-radius:14px;
    padding:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title{
    font-size:15px;
    font-weight:500;
}

.subtitle{
    font-size:13px;
    color:var(--muted);
    margin-top:4px;
}

/* BOTÕES PEQUENOS */
.btn{
    width:28px;
    height:28px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.08);
    background:transparent;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:14px;
}

.delete{
    border-color:rgba(255,77,77,0.3);
    color:var(--danger);
}

.games{
    border-color:rgba(79,124,255,0.3);
    color:var(--accent);
}

/* BOTÃO ADD */
.fab{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    background:var(--accent);
    border:none;
    color:white;
    padding:14px 20px;
    border-radius:12px;
    width:220px;
    cursor:pointer;
}

/* MODAL */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    display:none;
    align-items:center;
    justify-content:center;
}

.modal{
    width:92%;
    max-width:380px;
    background:var(--card);
    border-radius:16px;
    padding:18px;
}

input,select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.08);
    background:#0e1524;
    color:var(--text);
    margin-bottom:10px;
}

.actions{
    display:flex;
    gap:10px;
}

.save{
    background:var(--accent);
    color:white;
    border:none;
    padding:12px;
    flex:1;
    border-radius:10px;
}

.cancel{
    background:#1a2235;
    color:var(--text);
    border:none;
    padding:12px;
    flex:1;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="header" id="header">Consoles</div>

<div class="list" id="list"></div>

</div>

<button class="fab" onclick="openAdd()">Adicionar</button>

<!-- MODAL -->
<div class="overlay" id="overlay">
<div class="modal">
<input id="name" placeholder="Nome">

<select id="type">
<option>PlayStation 5</option>
<option>PlayStation 4</option>
<option>Xbox Series X</option>
<option>Xbox Series S</option>
<option>Nintendo Switch</option>
<option>Steam Deck</option>
<option>Outros</option>
</select>

<div class="actions">
<button class="cancel" onclick="closeModal()">Cancelar</button>
<button class="save" onclick="saveItem()">Salvar</button>
</div>

</div>
</div>

<script>

let mode = "consoles";
let consoles = [];
let selected = null;

function save(){
    localStorage.setItem("data", JSON.stringify(consoles));
}

function load(){
    const d = localStorage.getItem("data");
    if(d) consoles = JSON.parse(d);
    render();
}

/* RENDER */
function render(){
    const list = document.getElementById("list");
    const header = document.getElementById("header");

    list.innerHTML = "";

    if(mode === "consoles"){
        header.innerText = "Consoles";

        consoles.forEach((c,i)=>{
            list.innerHTML += `
            <div class="card">
                <div>
                    <div class="title">${c.name}</div>
                    <div class="subtitle">${c.type}</div>
                </div>

                <div style="display:flex; gap:6px;">
                    <button class="btn games" onclick="openGames(${i})">J</button>
                    <button class="btn delete" onclick="removeConsole(${i})">×</button>
                </div>
            </div>
            `;
        });
    }

    if(mode === "games"){
        header.innerText = "Jogos - " + consoles[selected].name;

        consoles[selected].games.forEach((g,i)=>{
            list.innerHTML += `
            <div class="card">
                <div>
                    <div class="title">${g}</div>
                </div>

                <button class="btn delete" onclick="removeGame(${i})">×</button>
            </div>
            `;
        });
    }
}

/* CONSOLES */
function removeConsole(i){
    consoles.splice(i,1);
    save();
    render();
}

/* GAMES */
function openGames(i){
    selected = i;

    if(!consoles[i].games){
        consoles[i].games = [];
    }

    mode = "games";
    render();
}

function removeGame(i){
    consoles[selected].games.splice(i,1);
    save();
    render();
}

/* MODAL */
let addType = "console";

function openAdd(){
    document.getElementById("overlay").style.display="flex";
}

function closeModal(){
    document.getElementById("overlay").style.display="none";
}

function saveItem(){
    const name = document.getElementById("name").value;

    if(!name) return;

    if(mode === "consoles"){
        consoles.push({
            name,
            type: document.getElementById("type").value,
            games:[]
        });
    } else {
        consoles[selected].games.push(name);
    }

    save();
    render();
    closeModal();

    document.getElementById("name").value="";
}

/* CLICK HEADER VOLTAR */
document.getElementById("header").onclick = ()=>{
    if(mode === "games"){
        mode = "consoles";
        render();
    }
};

load();

</script>

</body>
</html>
